# Nom de l'application
spring.application.name=backend

# Base de données (Compatible XAMPP Local sans mot de passe et Aiven Cloud)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Configuration upload (limites de taille)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.file-size-threshold=2MB

# JWT
jwt.secret=${JWT_SECRET:your_default_jwt_secret_key_change_in_production}

# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Logs
logging.level.org.springframework.web=DEBUG
logging.level.com.ecommerce.backend=DEBUG

# Configuration Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your_cloudinary_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your_cloudinary_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your_cloudinary_api_secret}

# URL du Frontend (CORS & redirections OAuth2)
frontend.url=${FRONTEND_URL:https://sevenshop-interface.onrender.com}

